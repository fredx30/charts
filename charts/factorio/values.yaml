# Default values for factorio.
# Dockerhub ref: https://hub.docker.com/r/factoriotools/factorio/
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

image:
  repository: factoriotools/factorio
  # This sets the pull policy for images.
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  # Rootless variants run as a fixed non-root UID; the securityContext defaults
  # below assume them. Data previously managed by the root image is owned
  # 845:845, so we keep that UID instead of the image default (1000).
  tag: "stable-rootless"

# This is for the secretes for pulling an image from a private repository more information can be found here: https://kubernetes.io/docs/tasks/configure-pod-container/pull-image-private-registry/
imagePullSecrets: [ ]
# This is to override the chart name.
nameOverride: ""
fullnameOverride: ""

envVars:
  - name: INSTANCE_NAME
    value: Your Instance's Name
  - name: INSTANCE_DESC
    value: Your Instance's Description
  - name: PORT
    value: "34197"
  - name: RCON_PORT
    value: "27015"
  - name: SAVE_NAME
    value: "game_save_1"
  - name: DLC_SPACE_AGE
    value: "true"
  - name: USERNAME
    value: ""
  - name: TOKEN
    value: ""
  # - name: UPDATE_MODS_ON_START
  #   value: ""

# This is for setting Kubernetes Annotations to a Pod.
# For more information checkout: https://kubernetes.io/docs/concepts/overview/working-with-objects/annotations/ 
podAnnotations: { }
# This is for setting Kubernetes Labels to a Pod.
# For more information checkout: https://kubernetes.io/docs/concepts/overview/working-with-objects/labels/
podLabels: { }

# 845 is the factorio user of the pre-rootless image; existing data volumes are owned by it.
# fsGroup has no effect on hostPath volumes - ownership must match runAsUser/runAsGroup.
podSecurityContext:
  runAsUser: 845
  runAsGroup: 845
  fsGroup: 845
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

# readOnlyRootFilesystem would break the entrypoint (sed -i on /opt/factorio/config/config.ini).
securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL

# Expose game traffic via a Service (e.g. LoadBalancer or Gateway API UDPRoute) instead.
hostNetwork: false

# When managed, an init container copies the server-settings ConfigMap onto the data
# volume on every start, overwriting manual edits. Requires the "factorio" and
# "server-settings" volumes below to be present.
serverSettings:
  managed: true
  gamePassword: ""

# This is for setting up a service more information can be found here: https://kubernetes.io/docs/concepts/services-networking/service/
service:
  enabled: true
  # This sets the service type more information can be found here: https://kubernetes.io/docs/concepts/services-networking/service/#publishing-services-service-types
  type: ClusterIP
  # This is the RCON port -
  portTcp: 27015
  # This is required - game traffic is sent over UDP
  portUdp: 34197

# Gateway API UDPRoute for game traffic. The referenced Gateway needs a UDP
# listener on service.portUdp that allows routes from this namespace.
udpRoute:
  enabled: false
  parentRef:
    name: ""
    namespace: ""
    sectionName: ""

resources:
  requests:
    cpu: 500m
    memory: 2Gi
  limits:
    cpu: 2000m
    memory: 4Gi

# Additional volumes on the output Deployment definition.
volumes:
  - name: factorio
    # HostPath sample
    hostPath:
      path: /home/factorio
    #
    # Ephemeral sample (local storage)
    # ephemeral:
    #   volumeClaimTemplate:
    #     spec:
    #       accessModes: [ "ReadWriteOnce" ]
    #       resources:
    #         requests:
    #           storage: 50Gi
    #
    # PVC Sample
    # persistentVolumeClaim:
    #   claimName: factorio
  - name: server-settings
    configMap:
      name: server-settings

# Additional volumeMounts on the output Deployment definition.
volumeMounts:
  - name: factorio
    mountPath: "/factorio"
  #- name: server-settings
  #  mountPath: "/server-settings.json"
  #  key: "server-settings"

# Recreate is the safe default: the save data volume is single-writer, and with
# hostNetwork: true RollingUpdate would deadlock waiting for the old pod's ports.
deploymentStrategy:
  type: Recreate
  rollingUpdate:   # only used when type: RollingUpdate
    maxSurge: 1
    maxUnavailable: 0

nodeSelector: { }

tolerations: [ ]

affinity: { }
